<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Bài tập] Tái cấu trúc mã CSS cho sẵn - Responsive Grid SASS</title>
    <!-- Compiled CSS from SASS -->
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- Layout chính tái cấu trúc hoàn toàn không dùng inline styles -->
    <div class="gridcontainer layout-overlay">
        <!-- 1. Header Row -->
        <div class="gridwrapper gridwrapper--header">
            <div class="gridcontent gridcontent--full gridcontent--header"></div>
        </div>

        <!-- 2. Main Row (Menu + Body + Sidebar) -->
        <div class="gridwrapper gridwrapper--main">
            <!-- Left Menu: col-3 (25%) -->
            <div class="gridcontent gridcontent--white gridcontent--col-3">
                <div class="item-block item-block--menu"></div>
                <div class="item-block item-block--menu"></div>
                <div class="item-block item-block--menu"></div>
                <div class="item-block item-block--menu"></div>
            </div>

            <!-- Content spacing (6 columns) -->
            <div class="gridcontent gridcontent--white"></div>
            <div class="gridcontent gridcontent--white"></div>
            <div class="gridcontent gridcontent--white"></div>
            <div class="gridcontent gridcontent--white"></div>
            <div class="gridcontent gridcontent--white"></div>
            <div class="gridcontent gridcontent--white"></div>

            <!-- Right Sidebar: col-3 (25%) -->
            <div class="gridcontent gridcontent--white gridcontent--col-3">
                <div class="item-block item-block--sidebar"></div>
            </div>
        </div>

        <!-- 3. Footer Row -->
        <div class="gridwrapper gridwrapper--footer">
            <div class="gridcontent gridcontent--full gridcontent--footer"></div>
        </div>
    </div>

    <!-- Background Grid Columns (12 columns) -->
    <div class="gridcontainer grid-background">
        <div class="gridwrapper gridwrapper--bg-overlay">
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
            <div class="gridcontent gridcontent--border-black"></div>
        </div>
    </div>

    <p class="info-text">Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
